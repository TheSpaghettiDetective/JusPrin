# A cartesian printer on simulavr's atmega644p, sized like the app's generic
# Klipper printer (MyKlipper 0.4 nozzle: 250 x 250 x 250) so its G-code prints
# here unchanged. Pins follow Klipper's config/sample-simulavr.cfg.
#
# Two things about simulavr shape this file:
# - Its endstop pins always read as pressed, so homing never finds a switch.
#   [homing_override] sets the position instead of moving to the endstops.
# - Its thermistors read a fixed value (about 103 C), so heaters never reach a
#   target. The heater checks are relaxed and M109/M190 set the target without
#   waiting for it.
# Steps per mm are kept low (microsteps 2) so the simulated board keeps up
# with the speeds the app's G-code asks for.

[mcu]
serial: /opt/printer_data/run/simulavr.tty

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 20000
max_z_velocity: 25
max_z_accel: 500

[stepper_x]
step_pin: PA5
dir_pin: PA4
enable_pin: PA1
microsteps: 2
rotation_distance: 40
endstop_pin: ^PB0
position_min: 0
position_endstop: 0
position_max: 250

[stepper_y]
step_pin: PA3
dir_pin: PA2
enable_pin: PA1
microsteps: 2
rotation_distance: 40
endstop_pin: ^PB1
position_min: 0
position_endstop: 0
position_max: 250

[stepper_z]
step_pin: PC7
dir_pin: PC6
enable_pin: PA1
microsteps: 2
rotation_distance: 8
endstop_pin: ^PB2
position_min: 0
position_endstop: 0
position_max: 250

[extruder]
step_pin: PC3
dir_pin: PC2
enable_pin: PA1
microsteps: 2
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 200
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA7
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
min_extrude_temp: 0
max_temp: 300

[heater_bed]
heater_pin: PB3
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control: watermark
min_temp: 0
max_temp: 130

[verify_heater extruder]
max_error: 1000000
check_gain_time: 1000000

[verify_heater heater_bed]
max_error: 1000000
check_gain_time: 1000000

[fan]
pin: PD6

[homing_override]
axes: xyz
set_position_x: 0
set_position_y: 0
set_position_z: 0
gcode:
  G1 X0 Y0 Z0 F600

# What Moonraker and the app's G-code need
[virtual_sdcard]
path: /opt/printer_data/gcodes

[display_status]

[pause_resume]

[exclude_object]

[gcode_macro M109]
rename_existing: M109.1
gcode:
  M104 S{params.S|default(0)}

[gcode_macro M190]
rename_existing: M190.1
gcode:
  M140 S{params.S|default(0)}

# The generic Klipper printer's start and end G-code call these.
[gcode_macro PRINT_START]
gcode:
  M140 S{params.BED|default(0)}
  M104 S{params.EXTRUDER|default(0)}
  G28

[gcode_macro PRINT_END]
gcode:
  TURN_OFF_HEATERS
  M107

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
  TURN_OFF_HEATERS
  CANCEL_PRINT_BASE
