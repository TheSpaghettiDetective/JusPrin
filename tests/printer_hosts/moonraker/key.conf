# Trusts only requests from inside its own container (how ../keys.sh reads the
# key), so a request from the host without the API key gets HTTP 401.
[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: /opt/printer_data/run/klipper.sock

[machine]
provider: none
validate_service: False

[authorization]
trusted_clients:
  127.0.0.0/8
cors_domains:
  *

[history]

# The printer's camera, served by the camera service (../camera/go2rtc.yaml).
# Clients load these addresses themselves, so they name the host's port.
[webcam printer]
service: mjpegstreamer
target_fps: 10
target_fps_idle: 10
stream_url: http://127.0.0.1:7140/api/stream.mjpeg?src=klipper
snapshot_url: http://127.0.0.1:7140/api/frame.jpeg?src=klipper
